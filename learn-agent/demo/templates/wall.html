<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晨读卡 · 卡片墙</title>
<style>
  :root{
    --paper:#fbf8f0; --edge:#efeadd; --ink:#1b1a17; --muted:#6d6a60;
    --accent:#8c1d18; --rule:#cfc8b6;
    --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",Arial,sans-serif;
    --serif:"Songti SC","STSong","Noto Serif SC",SimSun,Georgia,serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:48px 18px 64px; background:var(--edge); color:var(--ink); font-family:var(--sans);}
  .wrap{max-width:640px; margin:0 auto;}
  h1{margin:0; font-family:var(--serif); font-size:34px; letter-spacing:.06em;}
  .sub{margin-top:10px; font-size:12.5px; color:var(--muted);}
  .list{margin-top:28px; border-top:1px solid var(--rule);}
  .item{display:flex; gap:16px; align-items:baseline; padding:14px 2px; border-bottom:1px solid var(--rule); text-decoration:none; color:var(--ink);}
  .item:hover{background:var(--paper);}
  .d{flex:0 0 64px; font-size:12px; color:var(--accent); letter-spacing:.06em;}
  .t{font-family:var(--serif); font-size:16px; line-height:1.5;}
  .foot{margin-top:26px; font-size:11.5px; color:var(--muted); line-height:1.9;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>晨读卡</h1>
    <div class="sub">共 {{COUNT}} 张 · 按日期倒序 · 索引更新于 {{UPDATED}}</div>
    <div class="list">
{{ITEMS}}
    </div>
    <div class="foot">
      这是一个教程示例项目：素材在 <code>data/quotes.json</code>，版式在 <code>templates/</code>，产物由 <code>tools/build.py</code> 生成。<br>
      改版式不会改内容，改内容不会改版式。
    </div>
  </div>
</body>
</html>
