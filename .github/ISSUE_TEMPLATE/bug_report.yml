name: Bug 报告
description: 跑不通、渲染错位、自检报红——先说清怎么复现
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先跑一遍体检，很多问题它直接就说清了：

        ```bash
        python ai-daily/tools/doctor.py
        ```

        安全问题（访问码泄露、可被越权访问）**不要**发在这里，见 [SECURITY.md](../../blob/main/SECURITY.md)。

  - type: dropdown
    id: area
    attributes:
      label: 哪一部分
      options:
        - 出报 / 拼版（assemble_issue.py）
        - 阅读器页面（site/index.html）
        - 安卓 APK
        - 自检 / 反向验证脚本
        - 教程与 demo（learn-agent）
        - 文档写错了
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 你期望发生什么，实际发生了什么。有截图请直接贴。
      placeholder: 点「往期」后列表空白，控制台报 `issues is not defined`
    validations:
      required: true

  - type: input
    id: cmd
    attributes:
      label: 复现命令
      description: 你敲的那条命令，原样贴出来
      placeholder: python ai-daily/tools/selfcheck.py --pre
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 完整报错
      description: 从第一行贴到最后一行，别只贴结论。FAIL 行和它的上一行通常才是关键。
      render: shell
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 系统、Python 版本、是否装了可选依赖（Pillow / qrcode / JDK）
      placeholder: Windows 11 · Python 3.13.2 · 无 Pillow
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我跑过 `doctor.py`，并把它的输出看完了
          required: true
        - label: 我搜过已有 issue，没找到同样的问题
          required: true
